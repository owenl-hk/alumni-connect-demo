<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font-size: 14px; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Alumni Connect</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: phone-style app column, centred on wide screens. Top bar, impact strip, four tabs (Match, Network, Circles, Board). */
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --ink: #14171f;
  --muted: #5d6472;
  --line: #e1e4ea;
  --accent: #f2b705;
  --on-accent: #14171f;
  --good: #0f766e;
  --good-bg: #dff3f0; --bad: #b4372c;
  --chip: #eceef3;
  --font-head: "Space Grotesk", system-ui, sans-serif;
  --font-body: "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --surface: #181c25; --ink: #eef0f5; --muted: #9aa2b1; --line: #2a303c;
    --accent: #f2b705; --on-accent: #14171f; --good: #5fd3c6; --good-bg: #123a36; --bad: #ff8b7e; --chip: #232936;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --surface: #181c25; --ink: #eef0f5; --muted: #9aa2b1; --line: #2a303c;
  --accent: #f2b705; --on-accent: #14171f; --good: #5fd3c6; --good-bg: #123a36; --bad: #ff8b7e; --chip: #232936;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--font-head); margin: 0; text-wrap: balance; }
button { font: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand { font-family: var(--font-head); font-weight: 700; font-size: 20px; display: flex; align-items: center; gap: 8px; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); }
.demo-tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.me { color: var(--muted); font-size: 13px; margin: 0; }

.impact { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.impact div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.impact b { display: block; font-family: var(--font-head); font-size: 22px; font-variant-numeric: tabular-nums; }
.impact span { font-size: 12px; color: var(--muted); }

.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--chip); border-radius: 12px; padding: 4px; gap: 4px; }
.tabs button { border: 0; background: transparent; color: var(--muted); padding: 8px 0; border-radius: 9px; font-weight: 600; font-size: 13px; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.badge { display: inline-block; min-width: 16px; padding: 0 4px; margin-left: 2px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-size: 11px; }

.cats { display: flex; flex-direction: column; gap: 6px; }
.cat-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.cat-row button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 2px; font-weight: 600; font-size: 14px; }
.cat-row button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; }
.chip.tag { background: var(--good-bg); color: var(--good); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.label { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }

.avatar { width: 44px; height: 44px; border-radius: 12px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--font-head); font-weight: 700; flex: none; }
.avatar.sm { width: 34px; height: 34px; font-size: 14px; border-radius: 9px; }
.profile-head { display: flex; gap: 12px; align-items: center; }
.meter { height: 8px; border-radius: 99px; background: var(--chip); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--good); }
.swipe { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
#view { overflow-x: clip; }
.swipeable { position: relative; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; }
.swipeable:active { cursor: grabbing; }
.swipe-hint { margin: 0; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; font-size: 15px; font-weight: 700; }
.swipe-hint .sl { color: var(--bad); }
.swipe-hint .sr { color: var(--good); }
.swipe .btn { padding: 16px 12px; font-size: 17px; }
.stamp { position: absolute; top: 16px; padding: 4px 12px; border: 4px solid; border-radius: 10px; background: var(--surface); font-family: var(--font-head); font-weight: 700; font-size: 24px; letter-spacing: .04em; opacity: 0; pointer-events: none; }
.stamp.yes { left: 14px; color: var(--good); border-color: var(--good); transform: rotate(-8deg); }
.stamp.no { right: 14px; color: var(--bad); border-color: var(--bad); transform: rotate(8deg); }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 12px; font-weight: 600; }
.btn.yes { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.sm { padding: 6px 12px; font-size: 13px; border-radius: 9px; }
.btn[aria-pressed="true"], .btn.done { background: var(--good-bg); color: var(--good); border-color: transparent; }
.enter { animation: pop .25s ease; }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .enter { animation: none; } }

.notice { background: var(--good-bg); border: 1px solid var(--good); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.notice b { color: var(--good); font-family: var(--font-head); }
.sec { display: flex; flex-direction: column; gap: 10px; }
.list { display: flex; flex-direction: column; gap: 12px; }
.item { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.item:first-child { border-top: 0; padding-top: 0; }
.who { display: flex; gap: 10px; align-items: center; }
.quote { background: var(--chip); border-radius: 12px; padding: 8px 12px; font-size: 14px; }
.thread { display: flex; flex-direction: column; gap: 6px; }
.msg { max-width: 88%; padding: 8px 12px; border-radius: 12px; font-size: 14px; background: var(--chip); }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--on-accent); }
.kind { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; }
.kind.ask { background: var(--accent); color: var(--on-accent); }
.kind.offer { background: var(--good-bg); color: var(--good); }
form { display: flex; flex-direction: column; gap: 8px; }
textarea, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; }
.people { display: flex; flex-direction: column; gap: 8px; }
.people > div { display: flex; gap: 10px; align-items: center; }
.foot { font-size: 12px; color: var(--muted); text-align: center; }
.gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.gallery:empty { display: none; }
.gallery img, .thumb img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); display: block; }
.thumb { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card-photo { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 12px; display: block; pointer-events: none; -webkit-user-drag: none; user-select: none; }
input[type="file"] { font: inherit; font-size: 13px; color: var(--ink); width: 100%; }
.stars { color: var(--accent); letter-spacing: 1px; white-space: nowrap; }
.stars .off { color: var(--line); }
.star { border: 0; background: none; padding: 2px 4px; font-size: 32px; line-height: 1; color: var(--line); cursor: pointer; }
.star.on { color: var(--accent); }
.star:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.slogan { margin: 8px 0 10px; font-family: var(--font-head); font-weight: 700; font-size: 22px; line-height: 1.35; text-wrap: balance; }
.slogan .no { color: var(--muted); }
.slogan .yes { background: var(--accent); color: var(--on-accent); padding: 3px 10px; border-radius: 6px; white-space: nowrap; }
.top-right { display: flex; align-items: center; gap: 8px; }
.icon-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.search { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.res { display: flex; gap: 10px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 10px; }
.res:first-child { border-top: 0; padding-top: 0; }
.btn:disabled { opacity: .5; cursor: default; }
.link { border: 0; background: none; padding: 0; color: var(--ink); font: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
input[type="text"], input[type="datetime-local"] { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; }
input[type="text"]:focus-visible, input[type="datetime-local"]:focus-visible, .link:focus-visible, .socials a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 13px; font-weight: 600; }
.socials a { color: var(--ink); text-decoration: none; background: var(--chip); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; }
.socials a:hover { text-decoration: underline; }
</style>

</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><span class="dot"></span>Alumni Connect</div>
    <div class="top-right"><span class="demo-tag">Demo · example data</span><button class="icon-btn" id="search-btn" type="button" aria-label="Search businesses and categories" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><line x1="15.5" y1="15.5" x2="21" y2="21"></line></svg></button></div>
  </div>
  <p class="slogan"><span class="no">Dating? No!</span> <span class="yes">Startups? Yes!</span></p>
  <div class="search" id="search" hidden>
    <input type="text" id="q" placeholder="Search a business or a category" aria-label="Search a business or a category" autocomplete="off">
    <div id="results" class="list"></div>
  </div>
  <p class="me">Signed in as <b id="me-name">Fern &amp; Co Bookkeeping</b> · Build A Business alumni · <button class="link" id="to-profile" type="button">My profile</button></p>

  <div class="impact" aria-label="Pilot results so far">
    <div><b id="s-conn">0</b><span>Connected</span></div>
    <div><b id="s-intros">0</b><span>Introductions</span></div>
    <div><b id="s-sales">0</b><span>Sales from intros</span></div>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" id="t-match" aria-selected="true" data-tab="match">Match</button>
    <button role="tab" id="t-network" aria-selected="false" data-tab="network">Network<span class="badge" id="badge" hidden></span></button>
    <button role="tab" id="t-circles" aria-selected="false" data-tab="circles">Circles</button>
    <button role="tab" id="t-board" aria-selected="false" data-tab="board">Board</button>
    <button role="tab" id="t-market" aria-selected="false" data-tab="market">Market</button>
  </div>

  <main id="view"></main>
  <p class="foot">Concept demo for the Build A Business hackathon. All businesses and messages are made up.</p>
</div>

<script>
(function () {
  var CATS = {
    connect: { label: "Connect", blurb: "Meet other founders. No strings attached." },
    collab: { label: "Collab", blurb: "Share customers or run a joint offer. Competitors are hidden." },
    learn: { label: "Learn", blurb: "Get advice from a founder further along." },
    teach: { label: "Teach", blurb: "Share what you know with founders earlier in their journey." },
    all: { label: "All", blurb: "Everyone, in any category. Each card shows what they are open to." }
  };
  var ORDER = ["connect", "collab", "learn", "teach"];

  function svgUri(svg) { return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); }
  var IMG_BRAND = svgUri("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 400'><rect width='600' height='400' fill='#f2b705'/><rect x='60' y='60' width='200' height='280' rx='16' fill='#14171f'/><text x='160' y='215' font-family='Arial,Helvetica,sans-serif' font-size='96' font-weight='700' fill='#f2b705' text-anchor='middle'>BB</text><rect x='300' y='60' width='240' height='80' rx='12' fill='#ffffff'/><rect x='300' y='160' width='240' height='80' rx='12' fill='#0f766e'/><rect x='300' y='260' width='240' height='80' rx='12' fill='#14171f'/><circle cx='340' cy='100' r='18' fill='#f2b705'/><circle cx='340' cy='200' r='18' fill='#ffffff'/><circle cx='340' cy='300' r='18' fill='#f2b705'/></svg>");
  var IMG_FOOD = svgUri("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 400'><rect width='600' height='400' fill='#0f766e'/><rect y='280' width='600' height='120' fill='#14171f'/><ellipse cx='300' cy='292' rx='190' ry='34' fill='#2a303c'/><ellipse cx='300' cy='272' rx='170' ry='28' fill='#f4f5f7'/><circle cx='250' cy='250' r='34' fill='#f2b705'/><circle cx='320' cy='240' r='30' fill='#e8643c'/><circle cx='372' cy='256' r='26' fill='#8bc34a'/><path d='M180 120 q15 -25 0 -50 M300 130 q15 -25 0 -50 M420 120 q15 -25 0 -50' stroke='#dff3f0' stroke-width='8' fill='none' stroke-linecap='round'/></svg>");
  var SAMPLES = [{ label: "Brand moodboard", src: IMG_BRAND }, { label: "Catering plate", src: IMG_FOOD }];

  var people = [
    { id: 1, name: "Brickworks Brand Studio", short: "BB", photo: IMG_BRAND, does: "Logos and branding for small shops and cafés", cats: ["connect", "collab", "learn"], likesYou: true,
      connect: { line: "Also based in Ancoats. Runs a monthly sketch club for founders.", step: "Grab a coffee this week. No agenda." },
      collab: { customers: ["Local shops", "Cafés", "New startups"], overlap: 92, offers: "10% off branding for referred customers", wants: "Bookkeeping help for their clients", step: "Book a 15-minute call and agree one joint offer: a free books health-check with every new brand." },
      learn: { teaches: "Positioning a small business so customers remember it", step: "Ask for a 30-minute call on your own branding." } },
    { id: 2, name: "Mill Street Insurance", short: "MS", does: "Business insurance for independent traders", cats: ["collab", "learn"], likesYou: true,
      collab: { customers: ["Local shops", "Market traders", "New startups"], overlap: 85, offers: "Warm intros to newly insured traders", wants: "Accountants to refer on", step: "Swap three customer introductions each this month. Each founder asks their customer first." },
      learn: { teaches: "Choosing business insurance without overpaying", step: "Book a 30-minute advice call." } },
    { id: 3, name: "Loop Events", short: "LE", does: "Pop-ups and launch events for local venues", cats: ["connect", "collab"], likesYou: false,
      connect: { line: "Hosts the quarterly alumni showcase. Knows most venues in Manchester.", step: "Say hello at the next circle." },
      collab: { customers: ["Cafés", "Venues", "Local shops"], overlap: 71, offers: "Stall space at the quarterly alumni showcase", wants: "A finance partner for their clients", step: "Co-host a stall at the next showcase and collect sign-ups together." } },
    { id: 4, name: "PixelPatch Web Design", short: "PP", does: "Simple websites for independent businesses", cats: ["collab", "teach"], likesYou: false,
      collab: { customers: ["Local shops", "New startups"], overlap: 78, offers: "Free site review for referred founders", wants: "Founders ready to sell online", step: "Each of you shares the other's name with two customers this week." },
      teach: { wants: "How to price a first retainer and send proper invoices", step: "Offer a 30-minute call on pricing and invoicing." } },
    { id: 5, name: "Northside Fitness Coaching", short: "NF", does: "Small-group coaching, 6 months in", cats: ["connect", "teach"], likesYou: true,
      connect: { line: "Newer to the network and keen to meet people in the same stage.", step: "Welcome them with a coffee." },
      teach: { wants: "Setting up books and getting VAT right", step: "Offer a 30-minute call on bookkeeping basics." } },
    { id: 6, name: "Harbour Street Catering", short: "HS", photo: IMG_FOOD, does: "Event catering, 3 years in", cats: ["connect", "learn"], likesYou: true,
      connect: { line: "Based near Salford Quays. Often looks for local suppliers.", step: "Grab a coffee this week." },
      learn: { teaches: "Growing from 1 to 5 staff without losing quality", step: "Book a 30-minute call on hiring." } }
  ];
  function byId(id) { for (var i = 0; i < people.length; i++) if (people[i].id === id) return people[i]; return null; }

  var state = {
    tab: "match", cat: "collab",
    seen: {},             // "cat:id" -> true once passed, swiped or messaged
    connected: [],        // {id,name,short,cat,thread:[{from,text}],intro,sale}
    requested: [],        // {id,name,short,cat,msg}
    incoming: [
      { id: 101, name: "Greenfield Tutors", short: "GT", cat: "learn", msg: "Hi! I'm six months in and VAT is a mess. Could you spare 20 minutes?" },
      { id: 102, name: "Cobble & Co Joinery", short: "CJ", cat: "collab", msg: "We build shopfronts for local shops. Would a joint offer with your bookkeeping work?" }
    ],
    composing: null, draft: "", open: null, rsvp: false, filter: "all", replied: {}, matchNote: null, viewBiz: null, mf: "all", adForm: false, circleForm: false, focusId: null, nf: "all", profileSaved: false, joined: {}, copen: null, cf: { format: "all", goal: "all" },
    profile: { name: "Fern & Co Bookkeeping", sector: "Finance and bookkeeping", description: "Friendly bookkeeping for sole traders and small shops in Greater Manchester. Monthly books, VAT and year-end, in plain English.", customers: "Local shops, Sole traders, Cafés", offers: "Free 30-minute books health-check for referred customers", wants: "Introductions to branding and web design studios", website: "", linkedin: "", instagram: "", x: "", photos: [] }
  };
  var posts = [
    { id: 1, kind: "ask", topic: "Pricing", by: "Loop Events", text: "How do you price a first retainer when the client has no budget history?", age: "1d", replies: 0 },
    { id: 2, kind: "offer", topic: "Design", by: "Brickworks Brand Studio", text: "I can review one pitch deck this week, free, for any alumni founder.", age: "2d", replies: 1 },
    { id: 3, kind: "ask", topic: "Customers", by: "PixelPatch Web Design", text: "Anyone sold to Ancoats cafés? Looking for an intro to one owner.", age: "3d", replies: 0 },
    { id: 4, kind: "ask", topic: "Legal", by: "Mill Street Insurance", text: "Who has a template contract for freelance associates?", age: "4d", replies: 2 },
    { id: 5, kind: "ask", topic: "Finance", by: "Anonymous founder", anon: true, text: "I'm behind on my tax return and embarrassed to say so. Who can help me catch up without judgement?", age: "5d", replies: 0 }
  ];
  var view = document.getElementById("view");

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (attrs[k] == null) return;
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k.indexOf("on") === 0) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function chips(list) { return el("div", { class: "row" }, list.map(function (t) { return el("span", { class: "chip", text: t }); })); }
  function isLinked(id) {
    return state.connected.some(function (c) { return c.id === id; }) || state.requested.some(function (r) { return r.id === id; });
  }
  function field(label, text) { return el("div", {}, [el("div", { class: "label", text: label }), el("div", { text: text })]); }

  function deck() {
    var list = people.filter(function (p) { return !isLinked(p.id) && effCat(p) !== null; });
    list.sort(function (a, b) { return (b.id === state.focusId) - (a.id === state.focusId); });
    return list;
  }
  function effCat(p) {
    if (state.cat !== "all") return p.cats.indexOf(state.cat) > -1 && !state.seen[state.cat + ":" + p.id] ? state.cat : null;
    for (var i = 0; i < ORDER.length; i++) {
      var k = ORDER[i];
      if (p.cats.indexOf(k) > -1 && !state.seen[k + ":" + p.id]) return k;
    }
    return null;
  }

    if (state.adForm) frag.appendChild(adForm());
    else frag.appendChild(el("button", { class: "btn yes", onclick: function () { state.adForm = true; render(); } }, ["+ Post an ad"]));
    frag.appendChild(el("div", { class: "row" }, ["all"].concat(AD_CATS).map(function (c) {
      return el("button", { class: "btn sm", "aria-pressed": String(state.mf === c), onclick: function () { state.mf = c; render(); } }, [c === "all" ? "All" : c]);
    })));
    var shown = LISTINGS.filter(function (a) { return state.mf === "all" || a.cat === state.mf; });
    if (!shown.length) frag.appendChild(el("div", { class: "card" }, [el("div", { class: "muted", text: "No ads in this category yet." })]));
    shown.forEach(function (a) { frag.appendChild(adCard(a, false)); });
    return frag;
  }

  /* ---------- Board tab ---------- */
  function boardView() {
    var frag = document.createDocumentFragment();
    var form = el("form", { id: "post-form", onsubmit: function (e) {
      e.preventDefault();
      var text = document.getElementById("p-text").value.trim();
      if (!text) return;
      var anon = document.getElementById("p-anon").checked;
      posts.unshift({ id: Date.now(), kind: document.getElementById("p-kind").value, topic: document.getElementById("p-topic").value, by: anon ? "Anonymous founder" : state.profile.name, anon: anon, mine: true, text: text, age: "now", replies: 0 });
      state.filter = "all"; render();
    } }, [
      el("div", { class: "row" }, [
        el("select", { id: "p-kind", "aria-label": "Post type", style: "flex:1" }, [el("option", { value: "ask", text: "Ask" }), el("option", { value: "offer", text: "Offer" })]),
        el("select", { id: "p-topic", "aria-label": "Topic", style: "flex:1" }, ["Customers", "Pricing", "Legal", "Design", "Finance", "Hiring"].map(function (t) { return el("option", { value: t, text: t }); }))
      ]),
      el("textarea", { id: "p-text", rows: "2", placeholder: "What do you need, or what can you offer this week?", "aria-label": "Post text" }),
      el("label", { class: "row small", for: "p-anon" }, [el("input", { type: "checkbox", id: "p-anon" }), "Post anonymously"]),
      el("p", { class: "hint", text: "Other founders won't see your name. MEC moderators can, to keep the board respectful." }),
      el("button", { class: "btn yes", type: "submit" }, ["Post (expires in 3 weeks)"])
    ]);
    frag.appendChild(el("div", { class: "card" }, [form]));
    frag.appendChild(el("div", { class: "row" }, ["all", "ask", "offer"].map(function (f) {
      return el("button", { class: "btn sm", "aria-pressed": String(state.filter === f), onclick: function () { state.filter = f; render(); } }, [f === "all" ? "All" : f === "ask" ? "Asks" : "Offers"]);
    })));
    var shown = posts.filter(function (p) { return state.filter === "all" || p.kind === state.filter; });
    frag.appendChild(el("div", { class: "card" }, [el("div", { class: "list" }, shown.map(function (p) {
      var replied = state.replied[p.id], n = p.replies + (replied ? 1 : 0);
      return el("div", { class: "item" }, [
        el("div", { class: "row" }, [el("span", { class: "kind " + p.kind, text: p.kind }), el("span", { class: "chip", text: p.topic }), el("span", { class: "muted small", text: p.age })]),
        el("div", { text: p.text }),
        el("div", { class: "row between" }, [
          el("span", { class: "muted small", text: p.by + (p.mine && p.anon ? " (you)" : "") + " · " + n + (n === 1 ? " reply" : " replies") }),
          p.mine || p.by.indexOf("Fern") === 0 ? null : el("button", { class: "btn sm", "aria-pressed": String(!!replied), onclick: function () { state.replied[p.id] = !state.replied[p.id]; render(); } }, [replied ? "Replied" : p.kind === "ask" ? "I can help" : "I'm interested"])
        ])
      ]);
    }))]));
    return frag;
  }

  function render() {
    view.textContent = "";
    if (state.tab !== "profile") state.profileSaved = false;
    var v = state.tab === "match" ? matchView() : state.tab === "network" ? networkView() : state.tab === "circles" ? circlesView() : state.tab === "profile" ? profileView() : state.tab === "market" ? marketView() : boardView();
    view.appendChild(v);
    ["match", "network", "circles", "board", "market"].forEach(function (t) { document.getElementById("t-" + t).setAttribute("aria-selected", String(state.tab === t)); });
    document.getElementById("s-conn").textContent = state.connected.length;
    document.getElementById("s-intros").textContent = state.connected.filter(function (c) { return c.intro; }).length;
    document.getElementById("s-sales").textContent = state.connected.filter(function (c) { return c.sale; }).length;
    var b = document.getElementById("badge");
    b.hidden = !state.incoming.length; b.textContent = state.incoming.length;
    document.getElementById("me-name").textContent = state.profile.name;
  }

  document.querySelectorAll("[data-tab]").forEach(function (b) {
    b.addEventListener("click", function () { state.tab = b.getAttribute("data-tab"); if (state.tab === "market") state.viewBiz = null; try { history.replaceState(null, "", "#" + state.tab); } catch (e) {} render(); });
  });
    /* ---------- Search ---------- */
  var searchEl = document.getElementById("search"), qEl = document.getElementById("q"), resEl = document.getElementById("results"), sBtn = document.getElementById("search-btn");
  function setHash() { try { history.replaceState(null, "", "#" + state.tab); } catch (e) {} }
  function closeSearch() { searchEl.hidden = true; sBtn.setAttribute("aria-expanded", "false"); qEl.value = ""; resEl.textContent = ""; }
  function unseenCat(p) {
    return ORDER.filter(function (c) { return p.cats.indexOf(c) > -1 && !state.seen[c + ":" + p.id]; })[0] || null;
  }
  function openPerson(p) {
    if (isLinked(p.id)) { state.tab = "network"; state.nf = "all"; }
    else {
      var k = unseenCat(p);
      if (!k) return;
      state.cat = k; state.tab = "match"; state.focusId = p.id; state.matchNote = null; state.composing = null;
    }
    setHash(); closeSearch(); render();
  }
  function runSearch() {
    var q = qEl.value.trim().toLowerCase();
    resEl.textContent = "";
    if (!q) return;
    var catHits = ORDER.filter(function (k) { return CATS[k].label.toLowerCase().indexOf(q) > -1; });
    var peopleHits = people.filter(function (p) {
      return p.name.toLowerCase().indexOf(q) > -1 || p.does.toLowerCase().indexOf(q) > -1 ||
        p.cats.some(function (k) { return CATS[k].label.toLowerCase().indexOf(q) > -1; });
    });
    catHits.forEach(function (k) {
      resEl.appendChild(el("div", { class: "res" }, [
        el("div", {}, [el("b", { text: CATS[k].label }), el("div", { class: "muted small", text: "Category · " + CATS[k].blurb })]),
        el("button", { class: "btn sm", onclick: function () { state.cat = k; state.tab = "match"; state.focusId = null; state.matchNote = null; state.composing = null; setHash(); closeSearch(); render(); } }, ["Browse"])
      ]));
    });
    peopleHits.forEach(function (p) {
      var linked = isLinked(p.id), k = unseenCat(p);
      var action = linked ? "See in Network" : k ? "View profile" : "Already reviewed";
      resEl.appendChild(el("div", { class: "res" }, [
        el("div", { class: "who" }, [el("div", { class: "avatar sm", text: p.short }), el("div", {}, [el("b", { text: p.name }), el("div", { class: "muted small", text: p.cats.map(function (c) { return CATS[c].label; }).join(" · ") })])]),
        el("button", { class: "btn sm", disabled: (!linked && !k) ? "disabled" : null, onclick: function () { openPerson(p); } }, [action])
      ]));
    });
    if (!catHits.length && !peopleHits.length) resEl.appendChild(el("div", { class: "muted small", text: "No businesses or categories match \"" + qEl.value.trim() + "\"." }));
  }
  sBtn.addEventListener("click", function () {
    if (searchEl.hidden) { searchEl.hidden = false; sBtn.setAttribute("aria-expanded", "true"); qEl.focus(); } else { closeSearch(); }
  });
  qEl.addEventListener("input", runSearch);
  qEl.addEventListener("keydown", function (e) { if (e.key === "Escape") { closeSearch(); sBtn.focus(); } });

  document.getElementById("to-profile").addEventListener("click", function () { state.tab = "profile"; try { history.replaceState(null, "", "#profile"); } catch (e) {} render(); });
  function fromHash() { var h = (location.hash || "").slice(1); if (["match", "network", "circles", "board", "market", "profile"].indexOf(h) > -1) state.tab = h; }
  window.addEventListener("hashchange", function () { fromHash(); render(); });
  fromHash();
  render();
})();
</script>

</body>
</html>
